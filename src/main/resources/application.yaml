spring:
  application:
    name: omnibus-api

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  file:
    name: logs/omnibus-api.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{traceId:-N/A}] %-5level %logger{36} - %msg%n"

server:
  port: ${SERVER_PORT:8080}