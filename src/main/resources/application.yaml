spring:
  application:
    name: omnibus-api

  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-production-please}
  access-token-expiration-minutes: ${JWT_ACESS_TOKEN_EXPIRATION_MINUTES:60}
  password-reset-expiration-minutes: ${JWT_RESET_PASSWORD_EXPIRATION_MINUTES:5}

email:
  sender-address: ${EMAIL_SENDER_ADDRESS}

logging:
  file:
    name: logs/omnibus-api.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{traceId:-N/A}] %-5level %logger{36} - %msg%n"

server:
  port: ${SERVER_PORT:8080}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}