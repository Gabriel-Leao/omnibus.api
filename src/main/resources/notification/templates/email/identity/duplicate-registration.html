<!DOCTYPE html>
<html
    th:replace="~{email/layout :: layout(title=${subject}, tag='Aviso de segurança', content=~{::content})}"
    xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="content">
  <p style="margin:0;text-align:center;font-family:Arial,Helvetica,sans-serif;font-size:15px;color:#3a3226;
              line-height:1.6;">
    Alguém tentou criar uma conta com este e-mail, mas você já possui uma conta na Omnibus.
    Se foi você, faça login normalmente. Se não foi você, ignore este e-mail.
  </p>
</th:block>
</body>
</html>
