<!DOCTYPE html>
<html

    xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="content">
  <p style="margin:0 0 14px;text-align:center;font-family:Arial,Helvetica,sans-serif;font-size:15px;
              color:#3a3226;line-height:1.6;">
    Seu cadastro na Omnibus foi concluído com sucesso. Agora você já pode explorar nossa
    seleção de omnibus da DC Comics e jogos retrô.
  </p>
  <p style="margin:0;text-align:center;font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#8a7d64;">

  </p>
</th:block>
</body>
</html>
