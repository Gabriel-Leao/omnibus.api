<!DOCTYPE html>
<html th:fragment="layout(title, tag, content)"
      xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title th:text="${title}">Omnibus</title>
  <!--
    Fonte real do site ainda não declarada aqui. Se o Omnibus usa uma
    Google Font ou font-face customizada para os títulos (ex.: Bangers,
    Anton, Bungee), adicione o @font-face/<link> logo abaixo e troque
    a font-family usada no header/tag pelo nome real, mantendo o mesmo
    fallback (Arial Narrow, Arial, sans-serif) para clientes de e-mail
    que ignoram fontes externas (Outlook desktop, alguns webmails).
  -->
</head>
<body style="margin:0;padding:0;background:#F1E7C6;">
<table cellpadding="0" cellspacing="0" role="presentation" style="background:#F1E7C6;" width="100%">
  <tr>
    <td align="center" style="padding:36px 14px;">

      <table cellpadding="0" cellspacing="0" role="presentation"
             style="max-width:520px;background:#FBF6E7;border:4px solid #141414;border-radius:8px;"
             width="100%">
        <tr>
          <td align="center" style="padding:22px 26px;border-bottom:3px solid #141414;">
              <span style="font-family:'Arial Narrow',Arial,sans-serif;font-size:26px;
                           font-weight:900;font-style:italic;letter-spacing:0.5px;
                           color:#141414;">OMNIBUS</span>
          </td>
        </tr>
        <tr>
          <td style="padding:3px 0 0;background:#E8491D;line-height:0;font-size:0;">&nbsp;</td>
        </tr>
        <tr>
          <td style="padding:22px 26px 0;">
              <span style="display:block;text-align:center;background:#F5A623;color:#141414;
                           font-family:'Arial Narrow',Arial,sans-serif;font-weight:900;
                           font-style:italic;font-size:16px;letter-spacing:0.5px;
                           text-transform:uppercase;padding:12px 14px;border:2px solid #141414;
                           border-radius:20px;"
                    th:text="${tag}">TAG</span>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 26px 30px;" th:insert="${content}"></td>
        </tr>
      </table>

      <table cellpadding="0" cellspacing="0" role="presentation" style="max-width:520px;"
             width="100%">
        <tr>
          <td align="center" style="padding-top:18px;">
            <p style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:12px;
                        color:#8a7d64;">Omnibus &middot; Comics &amp; Retro Games</p>
          </td>
        </tr>
      </table>

    </td>
  </tr>
</table>
</body>
</html>
