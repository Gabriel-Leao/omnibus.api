<!DOCTYPE html>
<html th:replace="~{email/layout :: layout(title=${subject}, tag=${tag}, content=~{::content})}"
      xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="content">
  <p style="margin:0 0 20px;text-align:center;font-family:Arial,Helvetica,sans-serif;font-size:15px;
              color:#3a3226;line-height:1.5;">Use o código abaixo para continuar:</p>

  <table align="center" cellpadding="0" cellspacing="0" role="presentation" style="margin:0 auto;">
    <tr>
      <td style="background:#141414;padding:14px 22px;border-radius:4px;
                   border:2px dashed #E8491D;">
          <span style="font-family:'Courier New',monospace;font-size:26px;font-weight:700;
                       letter-spacing:7px;color:#FBF6E7;" th:text="${code}"></span>
      </td>
    </tr>
  </table>

  <p style="margin:20px 0 0;text-align:center;font-family:Arial,Helvetica,sans-serif;font-size:13px;
              color:#8a7d64;line-height:1.5;">
    Esse código expira em 15 minutos. Se você não pediu isso, pode ignorar este e-mail.</p>
</th:block>
</body>
</html>
